<!DOCTYPE html>
<html lang="ko">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#0b1034;overscroll-behavior:none;touch-action:manipulation}
body{display:flex;justify-content:center;font-family:'Gowun Dodum',sans-serif;color:#f6eedb}
.app{position:relative;width:100%;max-width:430px;height:100dvh;min-height:560px;overflow:hidden;display:flex;flex-direction:column;background:#0b1034}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{display:none}
body[data-mode=start] .ui.m-start,body[data-mode=home] .ui.m-home,body[data-mode=deco] .ui.m-deco,body[data-mode=kt] .ui.m-kt,body[data-mode=lan] .ui.m-lan{display:flex}
body[data-mode=home] .ui.m-home.blk,body[data-mode=deco] .ui.m-deco.blk,body[data-mode=kt] .ui.m-kt.blk,body[data-mode=lan] .ui.m-lan.blk{display:block}
.top{position:absolute;top:0;left:0;right:0;z-index:3;align-items:center;gap:10px;padding:14px 16px;pointer-events:none}
.top>*{pointer-events:auto}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(232,184,74,.4);background:rgba(10,14,40,.7);color:#f6eedb;font-size:16px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.off{opacity:.45;position:relative}.icon-btn.off::after{content:'';position:absolute;width:26px;height:2px;background:#f6eedb;transform:rotate(-45deg)}
.top h2{font:22px 'Do Hyeon',sans-serif;color:#fff5dc;white-space:nowrap;font-weight:400}
.top .sp{flex:1;pointer-events:none}
.pill{height:38px;padding:0 16px;border:0;border-radius:999px;background:#e8b84a;color:#1a1640;font:17px 'Do Hyeon',sans-serif;cursor:pointer;white-space:nowrap}
.hint{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:3;font-size:13px;color:#f6eedb;background:rgba(10,14,40,.7);border:1px solid rgba(232,184,74,.3);border-radius:999px;padding:5px 12px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.hint.hide{opacity:0}
.float{position:absolute;right:14px;bottom:12px;z-index:3;flex-direction:column;gap:8px}
.float .icon-btn{width:44px;height:44px;font-size:19px}
.start{position:absolute;left:0;right:0;bottom:0;z-index:3;flex-direction:column;align-items:center;padding:60px 24px 0;text-align:center;background:linear-gradient(to top,rgba(9,13,38,.96) 55%,rgba(9,13,38,0))}
.start h1{font:56px/1.05 'Do Hyeon',sans-serif;font-weight:400;color:#fff5dc;white-space:nowrap}
.start .sub{margin-top:10px;font:19px 'Do Hyeon',sans-serif;color:#e8b84a;white-space:nowrap}
.start .btn{margin-top:22px}
.lumi-ft{--ft:#9b9cc6;padding:16px 0 20px;text-align:center;font-size:12px;line-height:1.7;color:var(--ft)}
.lumi-ft a{color:inherit;font-weight:400;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}
.btn{display:block;width:100%;height:52px;border:0;border-radius:8px;background:#e8b84a;color:#1a1640;font:20px 'Do Hyeon',sans-serif;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4}
.btn.line{background:none;border:1px solid rgba(232,184,74,.6);color:#f6eedb}
.btn:active,.card:active,.kt:active,.chip:active,.act:active,.icon-btn:active{transform:scale(.97)}
.home{flex:none;background:#0e1440;border-top:1px solid rgba(232,184,74,.2);padding:12px 16px 18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{height:54px;border-radius:12px;border:1px solid rgba(232,184,74,.4);background:#18215e;color:#f6eedb;font:18px 'Do Hyeon',sans-serif;cursor:pointer;white-space:nowrap}
.act.main{background:#e8b84a;border-color:#e8b84a;color:#1a1640}
.tray{flex:none;background:#0e1440;border-top:1px solid rgba(232,184,74,.2);padding:8px 0 14px}
.tabs{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:#9b9cc6;font:16px 'Do Hyeon',sans-serif;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab.on{background:#e8b84a;color:#1a1640}
.cards{display:flex;gap:8px;padding:2px 12px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;width:76px;border:1px solid rgba(232,184,74,.22);background:#18215e;border-radius:12px;padding:5px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#f6eedb;font:12px 'Gowun Dodum',sans-serif;touch-action:pan-x}
.card.on{border-color:#e8b84a;background:#2a357e}
.card canvas{width:64px;height:54px;pointer-events:none}
.card span{white-space:nowrap;letter-spacing:-.3px;pointer-events:none;max-width:100%;overflow:hidden}
.pop{position:absolute;z-index:4;display:none;transform:translate(-50%,-100%);background:#fff5dc;border-radius:12px;padding:4px;gap:2px}
.pop.on{display:flex}
.pop::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:#fff5dc}
.pop button{border:0;background:none;color:#1a1640;font:14px 'Do Hyeon',sans-serif;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#121a4e;border-radius:20px 20px 0 0;border-top:1px solid rgba(232,184,74,.35);padding:18px 16px 20px;transform:translateY(105%);transition:transform .3s ease}
.sheet.on{transform:none}
.sheet:not(.on),.after:not(.on){pointer-events:none}
.sheet h3{font:22px 'Do Hyeon',sans-serif;font-weight:400;color:#fff5dc;margin-bottom:4px;white-space:nowrap}
.sheet p.sub{font-size:13px;color:#9b9cc6;margin-bottom:14px;white-space:nowrap}
.kts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.kt{border:1px solid rgba(232,184,74,.22);background:#18215e;border-radius:12px;padding:6px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#f6eedb;font:12px 'Gowun Dodum',sans-serif}
.kt.on{border-color:#e8b84a;background:#2a357e}
.kt canvas{width:66px;height:62px;pointer-events:none}
.kt span{white-space:nowrap;letter-spacing:-.3px}
.wishbox{position:relative;margin-bottom:10px}
.wishbox textarea{width:100%;height:72px;resize:none;border-radius:12px;border:1px solid rgba(232,184,74,.4);background:#0e1440;color:#fff5dc;font:17px 'Gowun Dodum',sans-serif;padding:12px 14px 22px;outline:none;word-break:keep-all;user-select:text;-webkit-user-select:text}
.wishbox textarea::placeholder{color:#6f74a6}
.wishbox .cnt{position:absolute;right:12px;bottom:8px;font-size:12px;color:#6f74a6}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(232,184,74,.3);background:none;color:#e8d9a8;font:13px 'Gowun Dodum',sans-serif;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.back{border:0;background:none;color:#9b9cc6;font:13px 'Gowun Dodum',sans-serif;margin-top:12px;width:100%;cursor:pointer}
.after{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:16px 16px 20px;background:linear-gradient(to top,rgba(9,13,38,.95) 70%,rgba(9,13,38,0));transform:translateY(105%);transition:transform .35s ease}
.after.on{transform:none}
.after p{text-align:center;font:20px 'Do Hyeon',sans-serif;color:#fff5dc;margin:10px 0 14px;white-space:nowrap}
.after .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wish{position:absolute;z-index:3;transform:translate(-50%,-100%);white-space:nowrap;text-align:center;font:16px/1.4 'Gowun Dodum',sans-serif;color:#fff5dc;word-break:keep-all;pointer-events:none;padding:6px 12px;border-radius:12px;background:rgba(255,190,90,.16);border:1px solid rgba(255,210,120,.35)}
.wish.rise{animation:rise 3.2s ease-out forwards}
.wish.peek{animation:peek 2.4s ease forwards}
@keyframes rise{0%{opacity:0;margin-top:0}12%{opacity:1}65%{opacity:1}100%{opacity:0;margin-top:-70px}}
@keyframes peek{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:100px;z-index:6;background:#fff5dc;color:#1a1640;font-size:13px;padding:8px 14px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.siam{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;background:linear-gradient(#0b1034,#1c2260 70%,#141b52)}
body[data-mode=siam] .siam{display:flex}
.siam .top{position:relative;display:flex}
.siam-stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#sc{width:100%;flex:1;min-height:0;touch-action:none;display:block}
.siam-q{text-align:center;padding:0 20px;margin-top:4px}
.siam-q b{display:block;font:24px 'Do Hyeon',sans-serif;font-weight:400;color:#fff5dc;white-space:nowrap}
.siam-q span{display:block;font-size:14px;color:#9b9cc6;margin-top:6px;white-space:nowrap}
.siam-bottom{flex:none;padding:14px 16px 20px}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
.stick-no{position:absolute;left:50%;top:13%;transform:translate(-50%,-50%) scale(.6);opacity:0;font:64px 'Do Hyeon',sans-serif;color:#ffd77a;white-space:nowrap;transition:all .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.stick-no.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.result{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;overflow-y:auto;background:#0e1440;padding:64px 16px 0;-webkit-overflow-scrolling:touch}
.result.on{display:flex}
.result .top{position:fixed;max-width:430px;margin:0 auto;background:linear-gradient(#0e1440 70%,rgba(14,20,64,0));z-index:2}
.result img{width:100%;border-radius:10px;display:block}
.rbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.rrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rbtns .btn{height:50px}
.rbtns .btn.small{font-size:17px}
.bubble{position:absolute;z-index:9;transform:translate(-50%,-100%);background:#fff5dc;color:#1a1640;font-size:13px;padding:7px 12px;border-radius:10px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.bubble.on{opacity:1}
.bubble::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-bottom:0;border-top-color:#fff5dc}
.saveview{position:fixed;inset:0;z-index:20;background:rgba(5,8,25,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.saveview.on{display:flex}
.saveview img{max-width:100%;max-height:75vh;border-radius:8px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto;pointer-events:auto}
.saveview p{margin-top:14px;font-size:15px;color:#fff5dc;white-space:nowrap}
.saveview button{margin-top:14px;border:0;background:none;color:#9b9cc6;font-size:14px}
.topics{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:12px 20px 0;max-width:340px}
.tp{border:1px solid rgba(232,184,74,.45);background:none;color:#f6eedb;font:16px 'Do Hyeon',sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tp.on{background:#e8b84a;border-color:#e8b84a;color:#1a1640}
.siam.picking #topics{display:flex}.siam:not(.picking) #topics{display:none}
.modal{position:absolute;inset:0;z-index:12;display:none;align-items:flex-start;justify-content:center;background:rgba(5,8,25,.72);padding:22% 24px 24px}
.modal.on{display:flex}
.mbox{width:100%;max-width:330px;background:#fbf1d8;border:3px solid #d9a336;border-radius:18px;padding:24px 20px 20px;text-align:center;color:#3a1f10}
.mbox h3{font:26px 'Do Hyeon',sans-serif;font-weight:400;color:#8f2420;margin-bottom:12px;white-space:nowrap}
.mbox p{font-size:15px;line-height:1.6;margin-bottom:10px;white-space:nowrap}
body.en .mbox p,body.th .mbox p{white-space:normal;word-break:keep-all}
.mbox .btn{margin-top:8px;background:#8f2420;color:#fbf1d8}
.lanhold{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:16px 16px 20px;text-align:center;transform:translateY(105%);transition:transform .3s ease;background:linear-gradient(to top,rgba(9,13,38,.9) 60%,rgba(9,13,38,0))}
.lanhold.on{transform:none}.lanhold:not(.on){pointer-events:none}
.lanhold p{font-size:14px;color:#c9c2e6;margin:14px 0 12px;white-space:nowrap}
.globe svg{display:block}
.langmenu{position:absolute;z-index:30;display:none;flex-direction:column;min-width:150px;background:#fbf1d8;border:2px solid #d9a336;border-radius:14px;padding:6px;}
.langmenu.on{display:flex}
.langmenu button{display:flex;justify-content:space-between;align-items:center;gap:16px;border:0;background:none;color:#1a1640;font:16px 'Gowun Dodum','Mitr',sans-serif;padding:10px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.langmenu button span{font-family:'Mitr','Gowun Dodum',sans-serif}
.langmenu button.on{background:#f1dfae}
.langmenu button i{font-style:normal;color:#8f2420;font-weight:700}
body.th,body.th button,body.th textarea,body.th h1,body.th h2,body.th h3,body.th .lumi-ft{font-family:'Mitr',sans-serif!important;font-weight:400}
body.th .start h1{font-size:50px}
body.th .lumi-ft{font-family:'Gowun Dodum',sans-serif!important}
body.en .start h1{font-size:50px}
.top{gap:8px}
</style>
<script>
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1&&!e.target.closest('#cv'))e.preventDefault()},{passive:false});
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<350&&!e.target.closest('textarea'))e.preventDefault();lastTouchEnd=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
</script>
</head>
<body data-mode="start">
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
        <div class="ui m-start top"><span class="sp"></span><button class="icon-btn globe" aria-label="language"></button><button class="icon-btn snd" aria-label="sound">♪</button></div>
    <div class="ui m-start start">
      <h1 data-i="title">방콕 템플</h1>
      <p class="sub" data-i="sub">러이끄라통 소원 띄우기</p>
      <button class="btn" id="enter" data-i="enter">사원 입장하기</button>
      <footer class="lumi-ft">쓸데없이 진심인 B급 콘텐츠<br><a href="https://lumimori38.github.io/">©루미 오락실</a> · lumimori38</footer>
    </div>
        <div class="ui m-home top"><button class="icon-btn" id="toStart" aria-label="back">◀</button><h2 data-i="title">방콕 템플</h2><span class="sp"></span><button class="icon-btn globe" aria-label="language"></button><button class="icon-btn snd" aria-label="sound">♪</button></div>
        <div class="ui m-deco top"><h2 data-i="deco">마당 꾸미기</h2><span class="sp"></span><button class="pill" id="decoDone" data-i="done">완료</button><button class="icon-btn globe" aria-label="language"></button><button class="icon-btn snd" aria-label="sound">♪</button></div>
    <div class="ui m-deco blk hint" id="decoHint"></div>
        <div class="ui m-home m-deco float" id="float"><button class="icon-btn" id="rot" aria-label="rotate">⟳</button><button class="icon-btn" id="fit" aria-label="reset">⤢</button></div>
    <div class="pop" id="pop"></div>
        <div class="ui m-kt top"><button class="icon-btn" id="ktBack" aria-label="back">◀</button><h2 data-i="kt">끄라통 띄우기</h2><span class="sp"></span><button class="icon-btn info" data-info="kt" aria-label="info">?</button><button class="icon-btn globe" aria-label="language"></button><button class="icon-btn snd" aria-label="sound">♪</button></div>
    <div class="ui m-kt blk hint hide" id="ktHint" data-i="ktHint">끄라통을 위로 밀어 띄워 보세요</div>
    <div class="sheet" id="s1">
      <h3 data-i="ktPick">끄라통을 골라 주세요</h3>
      <p class="sub" data-i="ktPickSub"></p>
      <div class="kts" id="kts"></div>
      <button class="btn" id="next1" data-i="pickOk"></button>
    </div>
    <div class="sheet" id="s2">
      <h3 data-i="wishTitle"></h3>
      <p class="sub" data-i="ktWishSub"></p>
      <div class="wishbox"><textarea id="wish" maxlength="30" data-ph="wishPh"></textarea><span class="cnt" id="cnt">0/30</span></div>
      <div class="chips" id="chips"></div>
      <button class="btn" id="next2" disabled data-i="ktWishOk"></button>
      <button class="back" id="back2" data-i="ktRepick"></button>
    </div>
    <div class="after" id="after">
      <p data-i="ktDone"></p>
      <div class="row"><button class="btn line" id="more" data-i="ktMore"></button><button class="btn" id="ktHome" data-i="toYard"></button></div>
    </div>
        <div class="ui m-lan top"><button class="icon-btn" id="lanBack" aria-label="back">◀</button><h2 data-i="lan">콤로이 날리기</h2><span class="sp"></span><button class="icon-btn info" data-info="lan" aria-label="info">?</button><button class="icon-btn globe" aria-label="language"></button><button class="icon-btn snd" aria-label="sound">♪</button></div>
    <div class="sheet" id="l1">
      <h3 data-i="lanPick"></h3>
      <p class="sub" data-i="lanPickSub"></p>
      <div class="kts" id="lans"></div>
      <button class="btn" id="lnext1" data-i="pickOk"></button>
    </div>
    <div class="sheet" id="l2">
      <h3 data-i="wishTitle"></h3>
      <p class="sub" data-i="lanWishSub"></p>
      <div class="wishbox"><textarea id="lwish" maxlength="30" data-ph="wishPh"></textarea><span class="cnt" id="lcnt">0/30</span></div>
      <div class="chips" id="lchips"></div>
      <button class="btn" id="lnext2" disabled data-i="lanWishOk"></button>
      <button class="back" id="lback2" data-i="lanRepick"></button>
    </div>
    <div class="lanhold" id="lanhold">
      <p id="lanTip">불을 붙이면 따뜻한 공기로 떠올라요</p>
      <button class="btn hold" id="fire"><i id="fireBar"></i><span id="fireTxt">꾹 눌러서 불 붙이기</span></button>
    </div>
    <div class="after" id="lafter">
      <p data-i="lanDone"></p>
      <div class="row"><button class="btn line" id="lmore" data-i="lanMore"></button><button class="btn" id="lanHome" data-i="toYard"></button></div>
    </div>
    <div class="modal" id="infoModal"><div class="mbox">
      <h3 id="infoT"></h3><p id="info1"></p><p id="info2"></p><p id="info3"></p>
      <button class="btn" id="infoOk" data-i="infoOk"></button>
    </div></div>
    <div class="toast" id="toast"></div>
